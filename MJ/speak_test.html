<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>TTS quick test</title>
</head>
<body>
  <h3>Minimal TTS test (no other scripts)</h3>
  <textarea id="txt" style="width:300px;height:80px">Hello world</textarea><br>
  <button id="btn">Speak (test)</button>
  <audio id="player" controls style="display:block;margin-top:12px;width:320px"></audio>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      try {
        const text = document.getElementById('txt').value;
        const res = await fetch('http://127.0.0.1:5000/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, lang: 'en' })
        });
        const data = await res.json();
        console.log('speak response', data);
        const url = data.audio_url + '?t=' + Date.now();
        const player = document.getElementById('player');
        player.src = url;
        player.load();
        await player.play().catch(e => console.warn('autoplay blocked', e));
        console.log('played', url);
      } catch (e) {
        console.error(e);
        alert('Request failed (see console)');
      }
    });
  </script>
</body>
</html>
